<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="1024" height="1024">
  <defs>
    <linearGradient id="headHighlightGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(45,62,54,0.22)" />
      <stop offset="100%" stop-color="rgba(45,62,54,0.0)" />
    </radialGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="80" cy="147" rx="38" ry="7" fill="url(#shadowGrad)" />

  <!-- Curly Spiral Tail -->
  <g>
    <path d="M 122,118 C 132,122 142,118 140,108 C 138,98 126,100 128,110 C 130,116 136,116 137,112"
          fill="#A8E8D5" stroke="#2D3E36" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Feet -->
  <g>
    <path d="M 54,136 C 54,144 58,146 64,146 C 70,146 74,144 74,136 Z"
          fill="#A8E8D5" stroke="#2D3E36" stroke-width="3.2"
          stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 86,136 C 86,144 90,146 96,146 C 102,146 106,144 106,136 Z"
          fill="#A8E8D5" stroke="#2D3E36" stroke-width="3.2"
          stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Main Body Blob -->
  <g>
    <path d="M 80,44 C 108,44 126,62 126,92 C 126,122 110,140 80,140 C 50,140 34,122 34,92 C 34,62 52,44 80,44 Z"
          fill="#A8E8D5" stroke="#2D3E36" stroke-width="3.8"
          stroke-linejoin="round" />

    <!-- Head Highlight -->
    <path d="M 64,50 C 72,46 88,46 96,50 C 93,55 87,58 80,58 C 73,58 67,55 64,50 Z"
          fill="url(#headHighlightGrad)" />

    <!-- Cream Belly -->
    <ellipse cx="80" cy="108" rx="28" ry="24" fill="#FFF2DD" />
  </g>

  <!-- Floppy Ears -->
  <g>
    <path d="M 54,54 C 36,54 28,68 34,80 C 37,86 46,88 52,82 C 55,78 52,66 54,54 Z"
          fill="#A8E8D5" stroke="#2D3E36" stroke-width="3.6"
          stroke-linejoin="round" />
    <path d="M 40,73 C 44,79 48,81 51,77"
          fill="none" stroke="#2D3E36" stroke-width="2.6" stroke-linecap="round" />
  </g>
  <g>
    <path d="M 106,54 C 124,54 132,68 126,80 C 123,86 114,88 108,82 C 105,78 108,66 106,54 Z"
          fill="#A8E8D5" stroke="#2D3E36" stroke-width="3.6"
          stroke-linejoin="round" />
    <path d="M 120,73 C 116,79 112,81 109,77"
          fill="none" stroke="#2D3E36" stroke-width="2.6" stroke-linecap="round" />
  </g>

  <!-- Chubby Arms -->
  <g>
    <path d="M 45,95 C 40,95 38,103 44,107 C 50,111 54,105 52,99 Z"
          fill="#A8E8D5" stroke="#2D3E36" stroke-width="3.2"
          stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 115,95 C 120,95 122,103 116,107 C 110,111 106,105 108,99 Z"
          fill="#A8E8D5" stroke="#2D3E36" stroke-width="3.2"
          stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Face -->
  <g>
    <!-- Blush -->
    <ellipse cx="54" cy="85" rx="7" ry="4.5" fill="#FFAAA6" />
    <ellipse cx="106" cy="85" rx="7" ry="4.5" fill="#FFAAA6" />

    <!-- Nose -->
    <ellipse cx="80" cy="77.5" rx="2.5" ry="1.8" fill="#23342D" />

    <!-- Left Eye -->
    <g>
      <circle cx="66" cy="74" r="7.5" fill="#23342D" />
      <circle cx="64" cy="71.5" r="2.8" fill="#FFFFFF" />
      <circle cx="68" cy="76" r="1.3" fill="#FFFFFF" />
    </g>

    <!-- Right Eye -->
    <g>
      <circle cx="94" cy="74" r="7.5" fill="#23342D" />
      <circle cx="92" cy="71.5" r="2.8" fill="#FFFFFF" />
      <circle cx="96" cy="76" r="1.3" fill="#FFFFFF" />
    </g>

    <!-- Puppy "w" Smile -->
    <path d="M 73.5,81 Q 76.8,84.5 80,81.5 Q 83.2,84.5 86.5,81"
          fill="none" stroke="#2D3E36" stroke-width="2.8" stroke-linecap="round" />
  </g>
</svg>
